{% extends "index.html" %}

{% block main_content %}
    <h1>标签：{{ term.name }}</h1>

    <ul class="posts">
        {% for page in paginator?.pages or term.pages %}
            <li class="post">
                <a href="{{ page.permalink }}">{{ page.title or "" }}</a>
                {% if page.date %}<span class="meta">{{ page.date | date(format="%Y-%m-%d") }}</span>{% endif %}
            </li>
        {% endfor %}
    </ul>

    {{<archie.pagination paginator={paginator or false} extra={config.extra} lang />}}
{% endblock main_content %}
